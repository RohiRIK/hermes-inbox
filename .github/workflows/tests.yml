name: tests

# Inbox-only compatibility gate; never installs into a user's live profiles.
on:
  push:
    branches: [main, feat/fleet-inbox]
  pull_request:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inbox:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: Inbox · ${{ matrix.os }}
    steps:
      - name: Allow long paths on Windows
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      # Core's own setup-pm composite action uses workspace-relative helpers.
      # Check core out first at the root, then the candidate in its own directory.
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
      - uses: actions/checkout@v4
        with:
          path: source
      - name: Prepare Hermes' supported locked test runtime
        uses: ./.github/actions/setup-pm
        with:
          extras: '[]'
          test-environment: 'true'
          cache-suffix: fleet-inbox
      # pip ignores Hermes' reviewed tool.uv overrides (including the supported
      # Pillow/browser-harness combination). Use core's native PM environment.
      - name: Validate Inbox manifest
        shell: bash
        run: '"$HERMES_PYTHON" -m hermes_cli.main plugins validate source/inbox'
        env:
          PYTHONPATH: ${{ github.workspace }}
      - name: Run Inbox tests against isolated fixture stores
        shell: bash
        working-directory: source/inbox
        env:
          HERMES_KANBAN_HOME: ${{ runner.temp }}/hermes-home
          HERMES_AGENT_REPO: ${{ github.workspace }}
          PYTHONPATH: ${{ github.workspace }}
        run: '"$HERMES_PYTHON" -m pytest -q'
