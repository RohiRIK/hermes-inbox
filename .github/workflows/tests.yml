name: tests

# Inbox-only validation against current Hermes core; never deploys a plugin.
on:
  push:
    branches: [main, feat/fleet-inbox]
  pull_request:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inbox:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: Inbox · ${{ matrix.os }}
    steps:
      - name: Allow long paths on Windows
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Hermes and test dependencies
        run: python -m pip install -e ./hermes-agent pytest pytest-asyncio
      - name: Validate Inbox manifest
        run: python -m hermes_cli.main plugins validate source/inbox
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
          PYTHONPATH: ${{ github.workspace }}/hermes-agent
      - name: Run Inbox tests against isolated fixture stores
        working-directory: source/inbox
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
          HERMES_KANBAN_HOME: ${{ runner.temp }}/hermes-home
          HERMES_AGENT_REPO: ${{ github.workspace }}/hermes-agent
          PYTHONPATH: ${{ github.workspace }}/hermes-agent
        run: python -m pytest -q
