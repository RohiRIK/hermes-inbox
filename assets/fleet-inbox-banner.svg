<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Hermes Fleet Inbox — abstract work threads flowing through five attention lanes: owner, action, wait, done, unknown">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1618"/>
      <stop offset="100%" stop-color="#061012"/>
    </linearGradient>
    <linearGradient id="threadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0d9488" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="laneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a1618" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect x="40" y="40" width="1120" height="340" rx="12" fill="url(#laneGrad)" stroke="#14b8a6" stroke-width="1" stroke-opacity="0.2"/>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" fill="#e6f4f1">
    <text x="80" y="95" font-size="36" font-weight="700" letter-spacing="-0.5px" filter="url(#softGlow)">Hermes Fleet Inbox</text>
    <text x="80" y="135" font-size="18" font-weight="400" fill="#94d3cc">Know what needs attention.</text>
  </g>

  <g transform="translate(80, 170)">
    <rect x="0" y="0" width="1040" height="200" fill="none"/>
    <g stroke="url(#threadGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <path d="M20,100 C150,60 300,140 450,100 C600,60 750,140 900,100 C1000,80 1020,90 1020,90" opacity="0.9"/>
      <path d="M20,130 C150,170 300,90 450,130 C600,170 750,90 900,130 C1000,150 1020,140 1020,140" opacity="0.7"/>
      <path d="M20,70 C150,110 300,30 450,70 C600,110 750,30 900,70 C1000,50 1020,60 1020,60" opacity="0.6"/>
    </g>

    <g font-size="11" font-weight="600" text-anchor="middle" fill="#7dd3c0">
      <text x="20"  y="30"  transform="rotate(-90 20,30)">OWNER</text>
      <text x="240" y="30"  transform="rotate(-90 240,30)">ACTION</text>
      <text x="480" y="30"  transform="rotate(-90 480,30)">WAIT</text>
      <text x="760" y="30"  transform="rotate(-90 760,30)">DONE</text>
      <text x="1000" y="30" transform="rotate(-90 1000,30)">UNKNOWN</text>
    </g>

    <g stroke="#14b8a6" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4,8">
      <line x1="130"  y1="10" x2="130"  y2="190"/>
      <line x1="360"  y1="10" x2="360"  y2="190"/>
      <line x1="620"  y1="10" x2="620"  y2="190"/>
      <line x1="880"  y1="10" x2="880"  y2="190"/>
    </g>

    <g fill="#14b8a6" opacity="0.85">
      <circle cx="180" cy="95" r="5"/>
      <circle cx="420" cy="130" r="5"/>
      <circle cx="680" cy="65" r="5"/>
      <circle cx="820" cy="100" r="5"/>
      <circle cx="960" cy="80" r="5"/>
    </g>

    <g font-size="10" font-weight="500" text-anchor="middle" fill="#5ec9b8">
      <text x="180" y="225">thread</text>
      <text x="420" y="225">work item</text>
      <text x="680" y="225">delegate</text>
      <text x="820" y="225">result</text>
      <text x="960" y="225">edge</text>
    </g>
  </g>
</svg>